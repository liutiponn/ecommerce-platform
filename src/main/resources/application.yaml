spring:
  application:
    name: ecommerce-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    proprieties:
      hibernate.format_sql: true

app:
  jwt:
    expiration-minutes: 120
    refresh-days: 30
  discount:
    category-name: Accesorii
    percentage: 15

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    aporetions-sorter: method

logging:
  level:
    md.impact.commerce: INFO